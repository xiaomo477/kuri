regist: ''                                # 备案号，无则留空

# tools / 第三方工具
analysis:
  platform: 51.la
  id:
  cd:
aplayer:
  enable: true                            # 是否开启音乐播放器
  platform: netease                       # 音乐平台
  type: playlist                          # 歌单类型
  id: 164238075                           # 歌单ID
  fixed: true                             # 是否固定播放器到底部

# Comment / 评论系统 (Waline)
# 先部署 Waline 后端（Vercel / Cloudflare Workers 等），把服务地址填到 server_url
comment:
  enable: true                            # 是否开启评论
  platform: waline                        # 评论平台
  server_url: https://waline.xiaomoo.top                 # Waline 后端地址（必填，改成你自己的）
  lang: zh-CN                             # 评论界面语言
  dark: auto                              # 深色模式：auto 跟随系统
  pageview: false                         # 是否显示文章阅读量
  emoji:                                  # 自定义表情包（可选）
    - https://unpkg.com/@waline/emojis@1.2.0/weibo

